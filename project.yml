name: OpenFlux
options:
  bundleIdPrefix: com.openflux
  deploymentTarget:
    iOS: "15.0"
targets:
  OpenFlux:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.openflux.client
      SWIFT_OBJC_BRIDGING_HEADER: ios/Bridging-Header.h
      HEADER_SEARCH_PATHS: output/ios
      LIBRARY_SEARCH_PATHS: output/ios
      OTHER_LDFLAGS: "$(inherited) -lresolv output/ios/liboflux.a"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
